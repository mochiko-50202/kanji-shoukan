name: 毎週ニュース自動保存（Gemini → Notion）

on:
  schedule:
    # 毎週月曜日 08:00 JST（日曜 23:00 UTC）に実行
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付（YYYY-MM-DD）省略時は直近の月曜日'
        required: false

jobs:
  generate-and-save-news:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージのインストール
        run: pip install requests

      - name: ニュース生成・Notion保存
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: '335f337d-ddd6-80f7-87e7-d98f8a857545'
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python .github/scripts/weekly_news.py "$DATE"
          else
            python .github/scripts/weekly_news.py
          fi
