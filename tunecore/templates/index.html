<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuneCore 登録ヘルパー</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif; }

  /* アーティスト dropdown */
  .artist-dropdown { position: relative; }
  .artist-dropdown summary {
    list-style: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
    cursor: pointer; background: white; user-select: none;
    font-size: 0.9rem; color: #1e293b;
  }
  .artist-dropdown summary::-webkit-details-marker { display: none; }
  .artist-dropdown summary::after {
    content: '▾'; color: #94a3b8; font-size: 0.9rem; transition: transform 0.15s;
    margin-left: 8px;
  }
  .artist-dropdown[open] summary::after { transform: rotate(180deg); }
  .artist-dropdown[open] summary {
    border-bottom-left-radius: 0; border-bottom-right-radius: 0;
    background: #f8fafc;
  }
  .artist-menu {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 30;
    border: 1px solid #e2e8f0; border-top: none;
    border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
    background: white; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.10);
  }
  .artist-item {
    padding: 10px 14px; cursor: pointer; font-size: 0.88rem;
    color: #334155; display: flex; align-items: center; gap: 8px;
    transition: background 0.1s;
  }
  .artist-item:hover { background: #f1f5f9; }
  .artist-item.selected { background: #eff6ff; color: #4338ca; font-weight: 500; }
  .artist-item .check { width: 14px; font-size: 0.75rem; color: #6366f1; flex-shrink: 0; }
  .custom-fields-wrap { padding: 10px 12px; background: #fafafa; border-top: 1px solid #f1f5f9; }

  /* 音源モードタブ */
  .mode-tabs { display: flex; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
  .mode-tab {
    flex: 1; padding: 7px 0; font-size: 0.78rem; cursor: pointer; text-align: center;
    color: #64748b; background: white; border: none; transition: all 0.15s;
  }
  .mode-tab.active { background: #6366f1; color: white; font-weight: 500; }
  .mode-tab:not(:last-child) { border-right: 1px solid #e2e8f0; }
  .drop-zone {
    border: 2px dashed #cbd5e1; border-radius: 10px; padding: 24px;
    text-align: center; color: #94a3b8; cursor: pointer; transition: all 0.2s;
  }
  .drop-zone.dragover { border-color: #6366f1; color: #6366f1; background: #f5f3ff; }
  .drop-zone:hover { border-color: #6366f1; color: #6366f1; background: #fafaff; }

  /* 結果フィールド */
  .field-row {
    display: grid; grid-template-columns: 190px 1fr auto;
    align-items: start; gap: 10px; padding: 8px 12px; border-radius: 6px;
    cursor: pointer; transition: background 0.3s;
  }
  .field-row:hover { background: #f8fafc; }
  .field-row.copied { background: #d1fae5 !important; transition: background 0s; }
  .field-row.field-fixed { background: #eff6ff; }
  .field-row.field-fixed:hover { background: #dbeafe; }
  .field-row.field-warn { background: #fff8e1; border-left: 3px solid #f59e0b; border-radius: 0 6px 6px 0; }
  .field-label { font-size: 0.73rem; color: #64748b; font-weight: 500; padding-top: 2px; }
  .field-value { font-size: 0.87rem; color: #1e293b; line-height: 1.5; word-break: break-word; }
  .badge-fixed { font-size: 0.6rem; background: #cbd5e1; color: #475569; padding: 1px 4px; border-radius: 3px; vertical-align: middle; margin-left: 2px; }
  .badge-ai { font-size: 0.65rem; color: #7c3aed; margin-left: 3px; }
  .copy-btn {
    font-size: 0.7rem; padding: 2px 6px; background: #f1f5f9;
    border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer;
    color: #475569; white-space: nowrap; flex-shrink: 0; margin-top: 1px;
    transition: background 0.1s;
  }
  .copy-btn:hover { background: #e2e8f0; }
  .section-hdr {
    font-size: 0.68rem; font-weight: 700; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 12px 3px;
  }
  .analyze-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 0.73rem;
    padding: 3px 9px; border-radius: 20px; border-width: 1px; margin-bottom: 6px;
  }
  .spinner {
    display: inline-block; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-bar { height: 6px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 9999px; transition: width 0.3s; }
</style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="tunecore()" x-init="init()">

<!-- ヘッダー -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-20">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-base font-bold text-gray-800">🎵 TuneCore 登録ヘルパー</span>
      <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded">β</span>
    </div>
    <span class="text-xs text-gray-400 hidden sm:block">Powered by Gemini AI</span>
  </div>
</header>

<div class="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

  <!-- ===== 左: 入力パネル ===== -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-5">楽曲情報を入力</h2>

    <!-- 曲タイトル -->
    <div class="mb-5">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        曲タイトル <span class="text-red-400">*</span>
      </label>
      <input x-model="title" type="text" placeholder="例: 夜の海"
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-transparent" />
    </div>

    <!-- アーティスト選択 (details/summary ドロップダウン) -->
    <div class="mb-5">
      <label class="block text-sm font-medium text-gray-700 mb-1">アーティスト <span class="text-red-400">*</span></label>
      <details class="artist-dropdown" id="artistDropdown">
        <summary id="artistSummary" class="text-sm">
          <span x-text="artistLabel"></span>
        </summary>
        <div class="artist-menu">
          {% for a in artists %}
          <div class="artist-item" :class="{'selected': artistId === '{{ a.id }}'}"
               @click="pickArtist('{{ a.id }}', '{{ a.name_ja }}')">
            <span class="check" x-show="artistId === '{{ a.id }}'">✓</span>
            <span class="check" x-show="artistId !== '{{ a.id }}'"></span>
            {{ a.name_ja }}
          </div>
          {% endfor %}
          <div class="artist-item" :class="{'selected': artistId === 'custom'}"
               @click="pickArtist('custom', 'その他（手入力）')">
            <span class="check" x-show="artistId === 'custom'">✓</span>
            <span class="check" x-show="artistId !== 'custom'"></span>
            <span class="text-gray-400">その他（手入力）</span>
          </div>
          <!-- 手入力フィールド -->
          <div class="custom-fields-wrap" x-show="artistId === 'custom'" x-cloak>
            <div class="grid grid-cols-2 gap-2">
              <input x-model="customArtistJa" type="text" placeholder="アーティスト名（日本語）"
                class="border border-gray-200 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-300" />
              <input x-model="customArtistEn" type="text" placeholder="Artist name (English)"
                class="border border-gray-200 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-300" />
            </div>
          </div>
        </div>
      </details>
    </div>

    <!-- 音源入力モード -->
    <div class="mb-5">
      <label class="block text-sm font-medium text-gray-700 mb-2">音源</label>
      <div class="mode-tabs mb-3">
        <button type="button" class="mode-tab" :class="{'active': audioMode === 'file'}"
                @click="setMode('file')">📁 ファイル</button>
        <button type="button" class="mode-tab" :class="{'active': audioMode === 'url'}"
                @click="setMode('url')">🔗 URL</button>
        <button type="button" class="mode-tab" :class="{'active': audioMode === 'skip'}"
                @click="setMode('skip')" title="音楽ファイルなしで生成">⏭ スキップ</button>
      </div>

      <!-- ファイルアップロードエリア -->
      <div x-show="audioMode === 'file'" x-cloak>
        <div class="drop-zone" id="dropZone"
             @dragover.prevent="$el.classList.add('dragover')"
             @dragleave.prevent="$el.classList.remove('dragover')"
             @drop.prevent="handleDrop($event)"
             @click="$refs.fileInput.click()">
          <div class="text-3xl mb-2" x-text="fileInfo ? '🎵' : '🎼'"></div>
          <template x-if="fileInfo">
            <div>
              <div class="text-sm font-medium text-indigo-600" x-text="fileInfo.name"></div>
              <div class="text-xs text-gray-400 mt-1" x-text="fileInfo.size"></div>
            </div>
          </template>
          <template x-if="!fileInfo">
            <div>
              <div class="text-sm font-medium">MP3 / WAV をドラッグ&ドロップ</div>
              <div class="text-xs mt-1">または <span class="text-indigo-500 underline">クリックして選択</span></div>
              <div class="text-xs text-gray-400 mt-2">最大15MB · AIが音楽を直接解析します</div>
            </div>
          </template>
        </div>
        <input type="file" x-ref="fileInput" accept="audio/*" class="hidden"
               @change="handleFileSelect($event)" />
      </div>

      <!-- URL入力 -->
      <div x-show="audioMode === 'url'" x-cloak>
        <input x-model="audioUrl" type="url"
               placeholder="https://youtu.be/... または Google Drive リンク"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        <p class="text-xs text-amber-600 mt-1.5">⚠️ URLから自動ダウンロードして解析します</p>
      </div>

      <!-- スキップ -->
      <div x-show="audioMode === 'skip'" x-cloak
           class="bg-gray-50 rounded-lg p-3 border border-gray-200">
        <p class="text-xs text-gray-500">音楽ファイルなし。テキストメモをもとにAIが推測して生成します。</p>
        <p class="text-xs text-gray-400 mt-0.5">※ 音声解析なしのため精度は下がります</p>
      </div>
    </div>

    <!-- 雰囲気メモ -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        雰囲気メモ <span class="text-gray-400 font-normal text-xs">（任意）</span>
      </label>
      <textarea x-model="notes" rows="2"
                placeholder="例: 切ない、ピアノ、夜、秋の雰囲気..."
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"></textarea>
    </div>

    <!-- 生成ボタン -->
    <button @click="generate()" :disabled="loading || !title.trim()"
            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 disabled:cursor-not-allowed text-white font-medium py-3 rounded-lg text-sm flex items-center justify-center gap-2 transition-colors">
      <span x-show="!loading">✨</span>
      <span x-show="loading" class="spinner w-4 h-4 border-2 border-white/30 border-t-white"></span>
      <span x-text="loading ? '生成中...' : 'TuneCore フィールドを生成する'"></span>
    </button>

    <!-- エラー表示 -->
    <div x-show="errorMsg" x-cloak class="mt-3 bg-red-50 border border-red-200 rounded-lg p-3">
      <p class="text-xs text-red-600" x-text="errorMsg"></p>
    </div>
  </div>

  <!-- ===== 右: 結果パネル ===== -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col" style="min-height: 520px">

    <!-- 待機状態 -->
    <div x-show="state === 'idle'" class="flex-1 flex flex-col items-center justify-center p-12 text-gray-400">
      <div class="text-5xl mb-4">🎼</div>
      <p class="text-sm text-center">楽曲情報を入力して<br>「生成する」をクリックしてください</p>
    </div>

    <!-- ロード中 -->
    <div x-show="state === 'loading'" class="flex-1 flex flex-col items-center justify-center p-12 text-gray-500">
      <div class="spinner w-8 h-8 border-4 border-gray-200 border-t-indigo-500 mb-4"></div>
      <p class="text-sm" x-text="loadingMsg"></p>
    </div>

    <!-- 結果 -->
    <div x-show="state === 'result'" x-cloak class="flex flex-col flex-1">

      <!-- 結果ヘッダー -->
      <div class="p-4 border-b border-gray-100">
        <!-- AI分析バッジ -->
        <template x-if="result && result.audio_analyzed">
          <span class="analyze-badge bg-green-50 text-green-700 border-green-200">✦ AIが音楽を直接分析しました</span>
        </template>
        <template x-if="result && !result.audio_analyzed">
          <span class="analyze-badge bg-amber-50 text-amber-700 border-amber-200">⚠ テキストメモのみで生成（音声未解析）</span>
        </template>

        <!-- タイトル・提出準備 -->
        <div class="flex items-start justify-between gap-2 mt-1">
          <div>
            <div class="text-base font-bold text-gray-800" x-text="result && result.track_title_ja"></div>
            <div class="text-xs text-gray-400" x-text="result && (result.genre || '')"></div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-xs text-gray-400 mb-1">提出準備</div>
            <div class="flex items-center gap-1.5">
              <div class="progress-bar w-20">
                <div class="progress-fill bg-green-400" :style="`width: ${readiness}%`"></div>
              </div>
              <span class="text-xs text-gray-600" x-text="`${readiness}%`"></span>
            </div>
          </div>
        </div>

        <!-- 警告 -->
        <template x-if="result && result.warnings && result.warnings.length > 0">
          <div class="mt-2 space-y-1">
            <template x-for="w in result.warnings" :key="w">
              <div class="text-xs text-amber-700 bg-amber-50 px-2 py-1 rounded border border-amber-100" x-text="'⚠ ' + w"></div>
            </template>
          </div>
        </template>
      </div>

      <!-- フィールドリスト -->
      <div class="flex-1 overflow-y-auto" style="max-height: 430px">

        <div class="section-hdr">セクション1: リリース情報</div>
        <template x-if="result">
          <div>
            <div class="field-row field-fixed" @click="copyField($event, result.release_title_ja)">
              <div class="field-label">リリースタイトル<span class="badge-fixed">固定</span></div>
              <div class="field-value" x-text="result.release_title_ja"></div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row" @click="copyField($event, result.release_title_yomigana)">
              <div class="field-label">タイトルヨミガナ<span class="badge-ai">✦</span></div>
              <div class="field-value" x-text="result.release_title_yomigana"></div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row" @click="copyField($event, result.release_title_en)">
              <div class="field-label">英語タイトル<span class="badge-ai">✦</span></div>
              <div class="field-value" x-text="result.release_title_en"></div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row" @click="copyField($event, result.genre)">
              <div class="field-label">ジャンル<span class="badge-ai">✦</span></div>
              <div>
                <div class="field-value" x-text="result.genre"></div>
                <div class="text-xs text-gray-400 mt-0.5" x-text="result.genre_reason"></div>
              </div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row" @click="copyField($event, result.subgenre)">
              <div class="field-label">サブジャンル<span class="badge-ai">✦</span></div>
              <div class="field-value" x-text="result.subgenre"></div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row field-fixed" @click="copyField($event, result.language)">
              <div class="field-label">言語<span class="badge-fixed">固定</span></div>
              <div class="field-value" x-text="result.language"></div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row field-warn">
              <div>
                <div class="field-label">発売日</div>
                <div class="text-xs text-amber-700 mt-0.5">⚠ TuneCoreで直接設定してください</div>
              </div>
              <div></div><div></div>
            </div>

            <div class="section-hdr">セクション2: アーティスト・レーベル</div>
            <div class="field-row field-fixed" @click="copyField($event, displayArtistJa)">
              <div>
                <div class="field-label">アーティスト名（日本語）<span class="badge-fixed">固定</span></div>
                <!-- 別名義切り替えリンク（アーティストが2名いる場合のみ表示） -->
                <template x-if="altArtist">
                  <div class="text-xs text-indigo-400 mt-0.5 cursor-pointer hover:text-indigo-600"
                       @click.stop="swapArtist()"
                       x-text="'↩ 別名義: ' + altArtist.name_ja"></div>
                </template>
              </div>
              <div class="field-value" x-text="displayArtistJa"></div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row field-fixed" @click="copyField($event, displayArtistEn)">
              <div class="field-label">アーティスト名（英語）<span class="badge-fixed">固定</span></div>
              <div class="field-value" x-text="displayArtistEn"></div>
              <button class="copy-btn">📋</button>
            </div>

            <div class="section-hdr">セクション3: 著作権</div>
            <div class="field-row field-fixed" @click="copyField($event, String(result.recording_year))">
              <div class="field-label">録音年<span class="badge-fixed">固定</span></div>
              <div class="field-value" x-text="result.recording_year"></div>
              <button class="copy-btn">📋</button>
            </div>
            <template x-if="result.copyright_notice">
              <div class="field-row field-fixed" @click="copyField($event, result.copyright_notice)">
                <div class="field-label">著作権表示<span class="badge-fixed">固定</span></div>
                <div class="field-value" x-text="result.copyright_notice"></div>
                <button class="copy-btn">📋</button>
              </div>
            </template>
            <template x-if="!result.copyright_notice">
              <div class="field-row field-warn">
                <div>
                  <div class="field-label">著作権表示</div>
                  <div class="text-xs text-amber-700 mt-0.5">⚠ tunecore_config.json の copyright_holder を設定してください</div>
                </div>
                <div></div><div></div>
              </div>
            </template>
            <template x-if="result.phonogram_copyright">
              <div class="field-row field-fixed" @click="copyField($event, result.phonogram_copyright)">
                <div class="field-label">レコード著作権<span class="badge-fixed">固定</span></div>
                <div class="field-value" x-text="result.phonogram_copyright"></div>
                <button class="copy-btn">📋</button>
              </div>
            </template>

            <div class="section-hdr">セクション4: トラック情報</div>
            <div class="field-row" @click="copyField($event, result.track_title_ja)">
              <div class="field-label">曲タイトル（日本語）</div>
              <div class="field-value" x-text="result.track_title_ja"></div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row" @click="copyField($event, result.track_title_yomigana)">
              <div class="field-label">曲タイトルヨミガナ<span class="badge-ai">✦</span></div>
              <div class="field-value" x-text="result.track_title_yomigana"></div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row" @click="copyField($event, result.track_title_en)">
              <div class="field-label">曲タイトル（英語）<span class="badge-ai">✦</span></div>
              <div class="field-value" x-text="result.track_title_en"></div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row field-fixed" @click="copyField($event, result.explicit_content ? 'はい' : 'いいえ')">
              <div class="field-label">明示的なコンテンツ<span class="badge-fixed">固定</span></div>
              <div class="field-value" x-text="result.explicit_content ? 'はい' : 'いいえ'"></div>
              <button class="copy-btn">📋</button>
            </div>

            <div class="section-hdr">セクション5: 説明文</div>
            <div class="field-row" @click="copyField($event, result.description_ja)">
              <div class="field-label">説明文（日本語）<span class="badge-ai">✦</span></div>
              <div>
                <div class="field-value text-xs leading-relaxed" x-text="result.description_ja"></div>
                <div class="text-xs text-gray-400 mt-0.5" x-text="`${(result.description_ja || '').length}/200字`"></div>
              </div>
              <button class="copy-btn">📋</button>
            </div>
            <div class="field-row" @click="copyField($event, result.description_en)">
              <div class="field-label">説明文（英語）<span class="badge-ai">✦</span></div>
              <div>
                <div class="field-value text-xs leading-relaxed" x-text="result.description_en"></div>
                <div class="text-xs text-gray-400 mt-0.5" x-text="`${(result.description_en || '').length}/200 chars`"></div>
              </div>
              <button class="copy-btn">📋</button>
            </div>
          </div>
        </template>
      </div>

      <!-- エクスポートボタン -->
      <div class="p-3 border-t border-gray-100 flex gap-2">
        <button @click="exportJSON()"
                class="text-xs text-gray-500 hover:text-gray-700 px-3 py-1.5 rounded border border-gray-200 transition-colors">
          💾 JSONで保存
        </button>
        <button @click="exportText()"
                class="text-xs text-gray-500 hover:text-gray-700 px-3 py-1.5 rounded border border-gray-200 transition-colors">
          📄 テキストで出力
        </button>
      </div>
    </div>

  </div><!-- /result panel -->
</div>

<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
function tunecore() {
  return {
    // 入力
    title: '',
    artistId: '{{ artists[0].id if artists else "" }}',
    artistLabel: '{{ artists[0].name_ja if artists else "選択してください" }}',
    customArtistJa: '',
    customArtistEn: '',
    audioMode: 'file',
    audioFile: null,
    fileInfo: null,
    audioUrl: '',
    notes: '',

    // 状態
    state: 'idle',  // idle | loading | result
    loading: false,
    loadingMsg: 'AIが解析中...',
    errorMsg: '',
    result: null,

    // アーティスト表示（別名義切り替え用）
    displayArtistJa: '',
    displayArtistEn: '',
    altArtist: null,
    swappedArtist: false,

    artists: {{ artists | tojson }},

    init() {
      if (this.artists.length > 0) {
        this.artistId = this.artists[0].id;
        this.artistLabel = this.artists[0].name_ja;
      }
    },

    get readiness() {
      if (!this.result) return 0;
      const fields = [
        'release_title_ja', 'release_title_yomigana', 'release_title_en',
        'genre', 'subgenre', 'track_title_en', 'description_ja', 'description_en',
      ];
      const filled = fields.filter(f => this.result[f] && this.result[f].toString().trim() !== '').length;
      const warnPenalty = (this.result.warnings || []).length * 5;
      return Math.max(0, Math.round((filled / fields.length) * 100) - warnPenalty);
    },

    pickArtist(id, label) {
      this.artistId = id;
      this.artistLabel = label;
      document.getElementById('artistDropdown').removeAttribute('open');
    },

    setMode(mode) {
      this.audioMode = mode;
      if (mode !== 'file') {
        this.audioFile = null;
        this.fileInfo = null;
      }
    },

    handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) this._setFile(file);
    },

    handleDrop(e) {
      document.getElementById('dropZone').classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) this._setFile(file);
    },

    _setFile(file) {
      this.audioFile = file;
      const mb = (file.size / 1024 / 1024).toFixed(1);
      this.fileInfo = { name: file.name, size: `${mb} MB` };
    },

    swapArtist() {
      if (!this.altArtist) return;
      const prev = { name_ja: this.displayArtistJa, name_en: this.displayArtistEn };
      const selectedId = this.artists.find(a => a.name_ja === this.altArtist.name_ja)?.id;
      this.displayArtistJa = this.altArtist.name_ja;
      this.displayArtistEn = this.altArtist.name_en;
      this.altArtist = prev;
    },

    async generate() {
      if (!this.title.trim()) return;
      this.loading = true;
      this.state = 'loading';
      this.errorMsg = '';
      this.result = null;

      const msgs = ['音楽ファイルを送信しています...', 'AIが解析中...', 'フィールドを生成しています...'];
      let mi = 0;
      this.loadingMsg = msgs[mi];
      const interval = setInterval(() => {
        mi = (mi + 1) % msgs.length;
        this.loadingMsg = msgs[mi];
      }, 2500);

      try {
        const form = new FormData();
        form.append('title', this.title.trim());
        form.append('artist_id', this.artistId);
        form.append('artist_custom_ja', this.customArtistJa);
        form.append('artist_custom_en', this.customArtistEn);
        form.append('notes', this.notes);
        form.append('audio_url', this.audioMode === 'url' ? this.audioUrl : '');
        if (this.audioMode === 'file' && this.audioFile) {
          form.append('audio_file', this.audioFile);
        }

        const resp = await fetch('/generate', { method: 'POST', body: form });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.detail || `HTTP ${resp.status}`);
        }

        this.result = data;
        this.state = 'result';

        // アーティスト表示設定
        if (this.artistId === 'custom') {
          this.displayArtistJa = this.customArtistJa;
          this.displayArtistEn = this.customArtistEn || this.customArtistJa;
          this.altArtist = null;
        } else {
          const selected = this.artists.find(a => a.id === this.artistId);
          this.displayArtistJa = selected?.name_ja || '';
          this.displayArtistEn = selected?.name_en || '';
          // 別名義（もう一方のアーティスト）
          const other = this.artists.find(a => a.id !== this.artistId);
          this.altArtist = other || null;
        }

      } catch (e) {
        this.errorMsg = `エラー: ${e.message}`;
        this.state = 'idle';
      } finally {
        clearInterval(interval);
        this.loading = false;
      }
    },

    copyField(event, value) {
      if (!value) return;
      navigator.clipboard?.writeText(value).catch(() => {});
      // 行ハイライト
      const row = event.currentTarget;
      row.classList.add('copied');
      const btn = row.querySelector('.copy-btn');
      const originalText = btn?.textContent;
      if (btn) btn.textContent = '✓';
      setTimeout(() => {
        row.classList.remove('copied');
        if (btn) btn.textContent = originalText;
      }, 1800);
    },

    exportJSON() {
      if (!this.result) return;
      const blob = new Blob([JSON.stringify(this.result, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tunecore_${this.result.track_title_ja || 'export'}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    },

    exportText() {
      if (!this.result) return;
      const r = this.result;
      const lines = [
        `=== TuneCore 登録情報: ${r.track_title_ja} ===`,
        '',
        `[リリース情報]`,
        `リリースタイトル: ${r.release_title_ja}`,
        `タイトルヨミガナ: ${r.release_title_yomigana}`,
        `英語タイトル: ${r.release_title_en}`,
        `ジャンル: ${r.genre}`,
        `サブジャンル: ${r.subgenre}`,
        `言語: ${r.language}`,
        '',
        `[アーティスト]`,
        `アーティスト名（日本語）: ${this.displayArtistJa}`,
        `アーティスト名（英語）: ${this.displayArtistEn}`,
        '',
        `[著作権]`,
        `録音年: ${r.recording_year}`,
        `著作権表示: ${r.copyright_notice}`,
        `レコード著作権: ${r.phonogram_copyright}`,
        '',
        `[トラック情報]`,
        `曲タイトル（日本語）: ${r.track_title_ja}`,
        `曲タイトルヨミガナ: ${r.track_title_yomigana}`,
        `曲タイトル（英語）: ${r.track_title_en}`,
        `明示的なコンテンツ: ${r.explicit_content ? 'はい' : 'いいえ'}`,
        '',
        `[説明文]`,
        `説明文（日本語）:`,
        r.description_ja,
        '',
        `説明文（英語）:`,
        r.description_en,
      ];
      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tunecore_${r.track_title_ja || 'export'}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    },
  };
}
</script>
</body>
</html>
